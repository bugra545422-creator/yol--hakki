name: Günlük soru güncellemesi
on:
  schedule:
    - cron: '17 3 * * *'   # her gün 06:17 (Türkiye saati)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ekle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kuyruktan yeni soruları ekle
        run: python3 .github/scripts/gunluk_soru.py
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "yol-hakki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorular.json kuyruk/kuyruk.json
          git commit -m "Günlük soru güncellemesi: $(date +%F)"
          git push
